<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Chat - Snap Save</title>
<style>
body { margin: 0; background: #000; font-family: Tahoma; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
.camera-screen { position: relative; width: 100%; height: 100vh; background: #111; display: flex; justify-content: center; align-items: center; }
video { width: 100%; height: 100%; object-fit: cover; }
.snap-controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: space-around; align-items: center; padding: 0 20px; box-sizing: border-box; }
.capture-btn { width: 75px; height: 75px; border-radius: 50%; background: transparent; border: 5px solid white; cursor: pointer; display: flex; justify-content: center; align-items: center; }
.capture-inner { width: 60px; height: 60px; border-radius: 50%; background: white; }
.icon-btn { background: rgba(0,0,0,0.5); color: white; border: none; padding: 12px 15px; border-radius: 50%; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="camera-screen">
<video id="cameraView" autoplay playsinline></video>
<div class="snap-controls">
<button class="icon-btn" onclick="switchCamera()">🔄</button>
<button class="capture-btn" onclick="capturePhoto()"><div class="capture-inner"></div></button>
<button class="icon-btn" style="visibility: hidden;">⚡</button>
</div>
</div>
<!-- کەناسی شاراوە بۆ دروستکردنی وێنەکە -->
<canvas id="canvas" style="display:none;"></canvas>
<script>
let currentFacingMode = 'user';
let stream = null;
async function startCamera() {
if (stream) {
stream.getTracks().forEach(track => track.stop());
}
try {
const constraints = { video: { facingMode: currentFacingMode } };
stream = await navigator.mediaDevices.getUserMedia(constraints);
document.getElementById('cameraView').srcObject = stream;
} catch (err) {
alert("نەتوانرا کامێرا بکرێتەوە.");
}
}
function switchCamera() {
currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
startCamera();
}
function capturePhoto() {
const video = document.getElementById('cameraView');
const canvas = document.getElementById('canvas');
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;
const ctx = canvas.getContext('2d');
ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
// گۆڕینی وێنەکە بۆ بەستەرێک بۆ دابەزاندن
const imageURL = canvas.toDataURL('image/jpeg');
const link = document.createElement('a');
link.href = imageURL;
link.download = 'dark-chat-snap.jpg';
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
startCamera();
</script>
</body>
</html>
