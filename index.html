<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Chat</title>
<style>
body { margin: 0; background: #000; font-family: Tahoma, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; color: white; }
.camera-screen { position: relative; width: 100%; height: 100vh; background: #111; display: flex; flex-direction: column; justify-content: space-between; }
video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
.top-bar { position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
.top-left, .top-right { display: flex; gap: 15px; align-items: center; }
.icon-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.icon-btn.active { color: #f1c40f; }
.middle-section { position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; }
.capture-container { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; }
.capture-btn { width: 75px; height: 75px; border-radius: 50%; background: transparent; border: 4px solid white; cursor: pointer; display: flex; justify-content: center; align-items: center; }
.capture-inner { width: 63px; height: 63px; border-radius: 50%; background: white; }
.memories-box { position: absolute; left: 40px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.memories-icon { width: 45px; height: 45px; border: 2px solid white; border-radius: 10px; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; position: relative; }
.memories-dot { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; background: #00a8ff; border-radius: 50%; border: 2px solid #000; }
.memories-text { font-size: 11px; margin-top: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.nav-bar { position: relative; z-index: 10; display: flex; justify-content: space-around; align-items: center; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); }
.nav-item { background: none; border: none; color: #888; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; }
.nav-item.active { color: #00a8ff; }
.nav-dot { position: absolute; top: -2px; right: 2px; width: 8px; height: 8px; background: #00a8ff; border-radius: 50%; }
</style>
</head>
<body>
<div class="camera-screen">
<video id="cameraView" autoplay playsinline></video>
<div class="top-bar">
<div class="top-left">
<button class="icon-btn" title="Search">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<circle cx="11" cy="11" r="8"></circle>
<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
</svg>
</button>
</div>
<div class="top-right">
<button class="icon-btn" title="Add Friend">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
<circle cx="8.5" cy="7" r="4"></circle>
<line x1="20" y1="8" x2="20" y2="14"></line>
<line x1="17" y1="11" x2="23" y2="11"></line>
</svg>
</button>
<button class="icon-btn" id="flashBtn" onclick="toggleFlash()" title="Flash">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
</svg>
</button>
<button class="icon-btn" onclick="switchCamera()" title="Switch Camera">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M9 14L4 9l5-5"/>
<path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
</svg>
</button>
</div>
</div>
<div class="middle-section">
<div class="capture-container">
<div class="memories-box" onclick="alert('Memories section')">
<div class="memories-icon">Pic<div class="memories-dot"></div></div>
<span class="memories-text">Memories</span>
</div>
<button class="capture-btn" onclick="capturePhoto()">
<div class="capture-inner"></div>
</button>
</div>
</div>
<div class="nav-bar">
<button class="nav-item">Map</button>
<button class="nav-item active">Chat<div class="nav-dot"></div></button>
<button class="nav-item">Camera</button>
<button class="nav-item">Groups</button>
<button class="nav-item">Spotlight</button>
</div>
</div>
<script>
let currentFacingMode = 'user';
let stream = null;
let flashOn = false;
async function startCamera() {
if (stream) {
stream.getTracks().forEach(track => track.stop());
}
try {
const constraints = {
video: { facingMode: currentFacingMode }
};
stream = await navigator.mediaDevices.getUserMedia(constraints);
document.getElementById('cameraView').srcObject = stream;
flashOn = false;
document.getElementById('flashBtn').classList.remove('active');
} catch (err) {
alert("Unable to access the camera.");
}
}
function switchCamera() {
currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
startCamera();
}
async function toggleFlash() {
if (!stream) return;
const track = stream.getVideoTracks()[0];
const capabilities = track.getCapabilities ? track.getCapabilities() : {};
if (capabilities.torch) {
try {
flashOn = !flashOn;
await track.applyConstraints({
advanced: [{ torch: flashOn }]
});
const flashBtn = document.getElementById('flashBtn');
if (flashOn) {
flashBtn.classList.add('active');
} else {
flashBtn.classList.remove('active');
}
} catch (err) {
alert("Flash is not supported on this device.");
}
} else {
alert("The current camera does not support flash.");
}
}
function capturePhoto() {
alert("Photo captured!");
}
startCamera();
</script>
</body>
</html>
