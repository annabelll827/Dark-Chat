<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body>
<input type="text" id="link" placeholder="لینکەکە لێرە دابنێ">
<button onclick="send()">ناردن بۆ تلیگرام</button>
<script>
function send() {
var url = document.getElementById('link').value;
var token = '8776982426:AAHwIFQIj36xbb_LoDZw7t1FpiRCLyzeu8U';
var chat_id = '7641255924';
fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({
chat_id: chat_id,
text: "📩 نامەی نوێی چات:\n\nسڵاو، لینکێکی نوێ ئامادەیە. تکایە کلیک لە دوگمەی خوارەوە بکە بۆ کردنەوەی:",
reply_markup: {
inline_keyboard: [[{text: "🔗 کردنەوەی لینکەکە", url: url}]]
}
})
}).then(response => {
if (response.ok) {
alert("بە سەرکەوتوویی نێردرا بۆ تلیگرام!");
} else {
alert("هەڵە ڕوویدا!");
}
});
}
</script>
</body>
</html>
