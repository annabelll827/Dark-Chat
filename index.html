<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Dark Chat</title>
    <style>
        body { font-family: Tahoma; background-color: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #cameraContainer { width: 100%; height: 40%; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .chat-box { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #2a2a2a; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
        .footer { display: flex; padding: 10px; background: #1f1f1f; }
        input { flex: 1; padding: 10px; border: none; border-radius: 5px; background: #2a2a2a; color: white; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; margin-right: 5px; }
    </style>
</head>
<body>
    <div id="cameraContainer">
        <video id="cameraView" autoplay playsinline></video>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message">Dark Chat دەستی پێکرد!</div>
    </div>
    <div class="footer">
        <input type="text" id="messageInput" placeholder="پەیام بنووسە...">
        <button onclick="sendMessage()">ناردن</button>
    </div>
    <script>
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('cameraView').srcObject = stream;
            } catch (err) {
                alert("تکایە ڕێگە بە کامێرا بدە.");
            }
        }
        startCamera();
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBox = document.getElementById('chatBox');
            if (input.value.trim() !== "") {
                const msg = document.createElement('div');
                msg.classList.add('message');
                msg.style.alignSelf = 'flex-end';
                msg.style.backgroundColor = '#0056b3';
                msg.textContent = input.value;
                chatBox.appendChild(msg);
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
